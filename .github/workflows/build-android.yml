name: Build Android debug APK

on:
  push:
    branches:
      - android-port
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "ndk;28.2.13676358" \
            "cmake;3.22.1" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install native build host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler python3 python3-protobuf

      - name: Restore project debug keystore
        if: env.KS != ''
        env:
          KS: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            -PchiakiAbiFilters=arm64-v8a \
            -PchiakiTakionReceiveBatching=false \
            -PchiakiAndroidEglRenderer=false \
            -PchiakiTakionSocketTuning=false

      - name: Prepare APK for publishing
        run: |
          mkdir -p build/android-release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            build/android-release/pleikkari-android-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pleikkari-android-debug
          path: build/android-release/pleikkari-android-debug.apk
          retention-days: 30

      - name: Move rolling release tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/android-port'
        run: |
          git tag --force android-latest "$GITHUB_SHA"
          git push --force origin refs/tags/android-latest

      - name: Update rolling prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/android-port'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android latest (android-port)
          body: |
            Debug APK built from commit ${{ github.sha }} on ${{ github.event.head_commit.timestamp }}.
          prerelease: true
          files: build/android-release/pleikkari-android-debug.apk
