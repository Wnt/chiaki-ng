plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

def rootCMakeLists = "../../CMakeLists.txt"
def rootCMakeListsContent = file(rootCMakeLists).text
static def grepVersionComponent(content, varname) {
    def match = content =~ /set\($varname ([0-9]+)\)/
    if(!match.find())
        throw new GradleException("Failed to find $varname in CMakeLists.txt")
    return match.group(1)
}
def chiakiVersionMajor = grepVersionComponent(rootCMakeListsContent, "CHIAKI_VERSION_MAJOR")
def chiakiVersionMinor = grepVersionComponent(rootCMakeListsContent, "CHIAKI_VERSION_MINOR")
def chiakiVersionPatch = grepVersionComponent(rootCMakeListsContent, "CHIAKI_VERSION_PATCH")
def chiakiVersion = "$chiakiVersionMajor.$chiakiVersionMinor.$chiakiVersionPatch"
println("Determined Chiaki Version: $chiakiVersion")

def takionReceiveBatching = (project.findProperty("chiakiTakionReceiveBatching") ?: "false").toBoolean()
def androidEglRenderer = (project.findProperty("chiakiAndroidEglRenderer") ?: "false").toBoolean()
// PLE-10: off by default; -PchiakiTakionSocketTuning=true builds the A/B "on" APK.
def takionSocketTuning = (project.findProperty("chiakiTakionSocketTuning") ?: "false").toBoolean()
// PLE-284: -PchiakiPsnMock=verified|nolink builds a debug APK that signs in against the PSN mock
// (android/psn-mock) instead of Sony. It is a separate app (com.metallic.chiaki.psnmock), so it can
// never overwrite a real install's PSN credentials, and a release build refuses the property.
def psnMockHosts = [verified: "pleikkari-psn.lab.madekivi.fi", nolink: "pleikkari-psn-nolink.lab.madekivi.fi"]
def psnMockArg = (project.findProperty("chiakiPsnMock") ?: "").toString().trim()
if(psnMockArg && !psnMockHosts.containsKey(psnMockArg))
    throw new GradleException("chiakiPsnMock must be one of ${psnMockHosts.keySet()}, not '$psnMockArg'")
def psnMockHost = psnMockArg ? psnMockHosts[psnMockArg] : ""
if(psnMockHost) {
    gradle.taskGraph.whenReady { graph ->
        if(graph.allTasks.any { it.name.toLowerCase().contains("release") })
            throw new GradleException("chiakiPsnMock is debug-only; refusing to build a release variant with it")
    }
}
def chiakiAbiFilters = (project.findProperty("chiakiAbiFilters") ?: "")
        .toString()
        .split(',')
        .collect { it.trim() }
        .findAll { it }

android {
    namespace "com.metallic.chiaki"
    compileSdk 35
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.metallic.chiaki"
        minSdk 24
        targetSdk 35
        versionCode 12
        versionName chiakiVersion
        ndk {
            abiFilters.addAll(chiakiAbiFilters)
        }
        buildConfigField "boolean", "CHIAKI_ANDROID_EGL_RENDERER", androidEglRenderer.toString()
        externalNativeBuild {
            cmake {
                arguments "-DCHIAKI_ENABLE_TESTS=OFF",
                        "-DCHIAKI_ENABLE_CLI=OFF",
                        "-DCHIAKI_ENABLE_GUI=OFF",
                        "-DCHIAKI_ENABLE_SETSU=OFF",
                        "-DCHIAKI_ENABLE_ANDROID=ON",
                        "-DCHIAKI_ENABLE_FFMPEG_DECODER=OFF",
                        "-DCHIAKI_ENABLE_PI_DECODER=OFF",
                        "-DCHIAKI_LIB_ENABLE_OPUS=OFF",
                        "-DCHIAKI_LIB_OPENSSL_EXTERNAL_PROJECT=ON",
                        "-DCHIAKI_LIB_JSONC_EXTERNAL_PROJECT=OFF",
                        "-DCHIAKI_LIB_MINIUPNPC_EXTERNAL_PROJECT=OFF",
                        "-DCHIAKI_ENABLE_STEAM_SHORTCUT=OFF",
                        "-DCHIAKI_ENABLE_STEAMDECK_NATIVE=OFF",
                        "-DCHIAKI_LIB_ENABLE_TAKION_RECEIVE_BATCHING=${takionReceiveBatching ? 'ON' : 'OFF'}",
                        "-DCHIAKI_ANDROID_EGL_RENDERER=${androidEglRenderer ? 'ON' : 'OFF'}",
                        "-DCHIAKI_LIB_ENABLE_TAKION_SOCKET_TUNING=${takionSocketTuning ? 'ON' : 'OFF'}",
                        "-DANDROID_STL=c++_shared",
                        "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                        "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-z,max-page-size=16384 -Wl,-z,common-page-size=16384"
            }
        }
    }

    buildFeatures {
        viewBinding true
        prefab true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += "-opt-in=kotlin.ExperimentalUnsignedTypes"
    }

    if(psnMockHost) {
        sourceSets.debug.manifest.srcFile "src/psnMock/AndroidManifest.xml"
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path rootCMakeLists
        }
    }

    signingConfigs {
        release
    }

    buildTypes {
        debug {
            buildConfigField "String", "PSN_MOCK_HOST", "\"$psnMockHost\""
            if(psnMockHost) {
                applicationIdSuffix ".psnmock"
                versionNameSuffix "-psnmock"
            }
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    Properties properties = new Properties()
    def propertiesFile = file("../local.properties")
    if (propertiesFile.exists()) {
        properties.load(propertiesFile.newDataInputStream())
    }

    if(properties.containsKey("chiakiKeystore")) {
        println("Enabling Local Signing")
        buildTypes.release.signingConfig = signingConfigs.release
        buildTypes.debug.signingConfig = signingConfigs.release
        signingConfigs.release.storeFile = file(properties.get("chiakiKeystore"))
        signingConfigs.release.storePassword = properties.get("chiakiKeystorePW")
        signingConfigs.release.keyAlias = properties.get("chiakiKeyAlias")
        signingConfigs.release.keyPassword = properties.get("chiakiKeyPW")
    } else {
        println("Signing not enabled")
    }

    // PLE-97: CI signs the debug APK with the project's debug keystore so it
    // installs over the test phone's registered app (`adb install -r`). The
    // path comes in as a gradle property; local builds keep AGP's default
    // ~/.android/debug.keystore lookup.
    if(project.hasProperty("chiakiDebugKeystore")) {
        println("Debug signing from " + project.property("chiakiDebugKeystore"))
        signingConfigs.debug.storeFile = file(project.property("chiakiDebugKeystore"))
        signingConfigs.debug.storePassword = "android"
        signingConfigs.debug.keyAlias = "androiddebugkey"
        signingConfigs.debug.keyPassword = "android"
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.core.ktx
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.preference.ktx
    implementation libs.material
    implementation libs.browser
    // PLE-324: only the PSN mock build's WebAuthn probe uses it; nothing in src/main does.
    debugImplementation libs.webkit

    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx

    implementation libs.coroutines.android
    implementation libs.serialization.json
    implementation libs.okhttp

    implementation libs.room.runtime
    ksp libs.room.compiler
    implementation libs.room.ktx

    implementation libs.moshi
    ksp libs.moshi.kotlin.codegen

    implementation libs.oboe

    testImplementation 'junit:junit:4.13.2'
    testImplementation libs.mockwebserver
    testImplementation libs.coroutines.test
}
