# VLAN 40 is L2-only in UniFi; this guest owns its DHCP and DNS service.
interface=eth1
bind-dynamic
dhcp-authoritative
dhcp-range=192.168.40.100,192.168.40.199,255.255.255.0,12h
dhcp-option=option:router,192.168.40.1
dhcp-option=option:dns-server,192.168.40.1
no-dhcp-interface=eth0
no-resolv
server=192.168.1.1
